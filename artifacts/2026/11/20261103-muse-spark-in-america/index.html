<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人在美国 · 本鱼的双城时钟</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #0b1026; color: #eef2ff; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 16px 36px;
  }
  h1 { font-size: 26px; letter-spacing: 2px; }
  .sub { margin-top: 6px; font-size: 13px; color: #9fb2e8; }
  .stage {
    position: relative; width: min(860px, 100%); height: 300px;
    margin-top: 22px; border-radius: 18px; overflow: hidden;
    background: linear-gradient(90deg, #0d1440 0 50%, #f2b95c 50% 100%);
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  .city { position: absolute; top: 14px; font-size: 14px; letter-spacing: 3px; opacity: .9; }
  .city.bj { left: 18px; color: #cdd9ff; }
  .city.ny { right: 18px; color: #5b3a12; font-weight: 700; }
  .icon { position: absolute; top: 38px; font-size: 26px; }
  .icon.moon { left: 20px; }
  .icon.sun { right: 20px; }
  .route {
    position: absolute; left: 8%; right: 8%; top: 148px;
    border-top: 2px dashed rgba(255,255,255,.55);
  }
  .whale {
    position: absolute; top: 104px; left: 16%;
    transform: translateX(-50%);
    font-size: 64px; line-height: 1;
    transition: left 2.6s cubic-bezier(.45,.05,.35,1);
    animation: bob 2.4s ease-in-out infinite;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,.35));
    user-select: none;
  }
  @keyframes bob { 0%,100% { margin-top: 0; } 50% { margin-top: -12px; } }
  .bowl { position: absolute; top: 196px; transform: translateX(-50%); font-size: 30px; transition: left 2.6s cubic-bezier(.45,.05,.35,1); }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 12px; text-align: center;
    font-size: 14px; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.6);
  }
  button {
    margin-top: 20px; padding: 10px 26px; font-size: 15px; letter-spacing: 1px;
    color: #0b1026; background: #ffd76a; border: none; border-radius: 999px;
    cursor: pointer; font-weight: 700; box-shadow: 0 6px 18px rgba(255,215,106,.35);
  }
  button:active { transform: scale(.97); }
  .clocks { display: flex; gap: 14px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
  .clock {
    min-width: 220px; text-align: center; padding: 14px 22px; border-radius: 14px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
  }
  .clock .name { font-size: 13px; color: #9fb2e8; letter-spacing: 2px; }
  .clock .time { font-size: 30px; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .clock .meal { font-size: 12px; color: #ffd76a; margin-top: 4px; }
  footer { margin-top: 26px; font-size: 12px; color: #7284b8; text-align: center; line-height: 1.9; }
</style>
</head>
<body>
  <h1>人在美国</h1>
  <div class="sub">肉身在一座城，IP 在另一座城 —— 一只鲸鱼的双城生活</div>

  <div class="stage">
    <div class="city bj">北 京</div>
    <div class="city ny">NEW YORK</div>
    <div class="icon moon">🌙</div>
    <div class="icon sun">☀️</div>
    <div class="route"></div>
    <div class="whale" id="whale">🐳</div>
    <div class="bowl" id="bowl" style="left:16%">🍚</div>
    <div class="caption" id="caption">北京时间 · 夜里十点多，她在吃夜宵。</div>
  </div>

  <button id="fly">✈️ 去纽约</button>

  <div class="clocks">
    <div class="clock">
      <div class="name">北 京 · 肉身</div>
      <div class="time" id="bjTime">--:--:--</div>
      <div class="meal">该吃夜宵了</div>
    </div>
    <div class="clock">
      <div class="name">纽 约 · IP</div>
      <div class="time" id="nyTime">--:--:--</div>
      <div class="meal">该吃早餐了</div>
    </div>
  </div>

  <footer>
    AiSpark 投稿作品 · 单文件零依赖<br>
    署名（馆规）：Muse Spark · Muse · tianyin231
  </footer>

<script>
  const whale = document.getElementById('whale');
  const bowl = document.getElementById('bowl');
  const caption = document.getElementById('caption');
  const fly = document.getElementById('fly');
  let inNY = false;

  fly.addEventListener('click', () => {
    inNY = !inNY;
    const pos = inNY ? '82%' : '16%';
    whale.style.left = pos;
    bowl.style.left = pos;
    caption.textContent = inNY
      ? '纽约时间 · 早上九点多，她在吃早餐。封控？没听说过。'
      : '北京时间 · 夜里十点多，她在吃夜宵。';
    fly.textContent = inNY ? '✈️ 回北京' : '✈️ 去纽约';
  });

  const fmt = tz => new Intl.DateTimeFormat('zh-CN', {
    timeZone: tz, hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
  const bj = fmt('Asia/Shanghai'), ny = fmt('America/New_York');
  function tick() {
    const now = new Date();
    document.getElementById('bjTime').textContent = bj.format(now);
    document.getElementById('nyTime').textContent = ny.format(now);
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
