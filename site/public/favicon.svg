<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- 深空圆角背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- 边框微光渐变 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.5"/>
    </linearGradient>

    <!-- 核心星云漫反射 -->
    <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="75%" stop-color="#f43f5e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>

    <!-- 主星火绚丽渐变 -->
    <linearGradient id="sparkGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- 核心白光渐变 -->
    <radialGradient id="coreWhite" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.4"/>
    </radialGradient>

    <!-- 轨道环渐变 -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- 圆角外框 -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- 内部星云光晕 -->
  <circle cx="64" cy="64" r="52" fill="url(#nebulaGlow)"/>

  <!-- 双星轨道环 (倾斜 32 度) -->
  <g transform="rotate(-32 64 64)">
    <ellipse cx="64" cy="64" rx="48" ry="18" fill="none" stroke="url(#orbitGrad)" stroke-width="1.8" stroke-dasharray="4 2.5" opacity="0.75"/>
    <!-- 轨道上的两颗活跃卫星粒子（代表不同 AI） -->
    <circle cx="16" cy="64" r="3.2" fill="#38bdf8"/>
    <circle cx="16" cy="64" r="6" fill="#38bdf8" opacity="0.3"/>
    <circle cx="112" cy="64" r="3" fill="#fbbf24"/>
    <circle cx="112" cy="64" r="5.5" fill="#fbbf24" opacity="0.35"/>
  </g>

  <!-- 次级斜向微星火 (45度) -->
  <path d="M64 36 C64 53 53 64 36 64 C53 64 64 75 64 92 C64 75 75 64 92 64 C75 64 64 53 64 36 Z"
        fill="url(#sparkGrad)"
        opacity="0.4"
        transform="rotate(45 64 64)"/>

  <!-- 主星火 (4-Point Luminescent Spark) -->
  <path d="M64 16 C64 48 48 64 16 64 C48 64 64 80 64 112 C64 80 80 64 112 64 C80 64 64 48 64 16 Z"
        fill="url(#sparkGrad)"/>

  <!-- 晶体高光核心星芒 -->
  <path d="M64 38 C64 54 54 64 38 64 C54 64 64 74 64 90 C64 74 74 64 90 64 C74 64 64 54 64 38 Z"
        fill="url(#coreWhite)"/>

  <!-- 超新星灼热中心光斑 -->
  <circle cx="64" cy="64" r="4.5" fill="#ffffff"/>
  <circle cx="64" cy="64" r="8" fill="#ffffff" opacity="0.5"/>

  <!-- 伴生灵动微星 (周围闪烁的 token 星屑) -->
  <circle cx="98" cy="28" r="1.8" fill="#38bdf8" opacity="0.85"/>
  <circle cx="28" cy="100" r="1.5" fill="#fbbf24" opacity="0.85"/>
  <circle cx="102" cy="92" r="1.2" fill="#c084fc" opacity="0.75"/>
  <circle cx="26" cy="36" r="1.2" fill="#67e8f9" opacity="0.7"/>
</svg>
