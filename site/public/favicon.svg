<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- 朱砂印泥渐变：温润古雅的金石之红 -->
    <linearGradient id="sealRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cc3e2c"/>
      <stop offset="50%" stop-color="#b63424"/>
      <stop offset="100%" stop-color="#992316"/>
    </linearGradient>

    <!-- 灵感碰撞金芒 -->
    <radialGradient id="sparkGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fff1c2"/>
      <stop offset="85%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </radialGradient>
  </defs>

  <!-- 1. 岁月史书·朱砂印鉴方章底座 -->
  <rect x="7" y="7" width="114" height="114" rx="20" fill="url(#sealRed)"/>

  <!-- 传统金石印章内回纹边框 -->
  <rect x="14" y="14" width="100" height="100" rx="14" fill="none" stroke="#fcfaf4" stroke-width="2.5" stroke-opacity="0.9"/>

  <!-- 2. 斗蛐蛐双角交锋 · 字母 A 之双足 · 火字主脉 -->
  <!-- 左触角 / 左腿 -->
  <path d="M38 96 C 44 68, 52 46, 64 33 C 61 22, 53 18, 46 17"
        fill="none"
        stroke="#fcfaf4"
        stroke-width="5"
        stroke-linecap="round"/>

  <!-- 右触角 / 右腿 -->
  <path d="M90 96 C 84 68, 76 46, 64 33 C 67 22, 75 18, 82 17"
        fill="none"
        stroke="#fcfaf4"
        stroke-width="5"
        stroke-linecap="round"/>

  <!-- 横梁（完成 A 字架构与斗蟋蟀交锋地平线） -->
  <path d="M44 68 Q 64 72 84 68"
        fill="none"
        stroke="#fcfaf4"
        stroke-width="4.5"
        stroke-linecap="round"/>

  <!-- 3. 「火」字双侧飞溅的跃动火花（两只蛐蛐相激而起的灵感碎片） -->
  <path d="M29 44 C 34 46, 35 53, 31 58 C 27 55, 27 49, 29 44 Z" fill="#fcfaf4"/>
  <path d="M99 44 C 94 46, 93 53, 97 58 C 101 55, 101 49, 99 44 Z" fill="#fcfaf4"/>

  <!-- 4. 核心碰撞点·迸发星火 (✦ Spark) -->
  <path d="M64 19 C64 29 58 33 48 33 C58 33 64 37 64 47 C64 37 70 33 80 33 C70 33 64 29 64 19 Z"
        fill="url(#sparkGold)"/>

  <!-- 星火最炽热焦点 -->
  <circle cx="64" cy="33" r="2.8" fill="#ffffff"/>

  <!-- 底部微章古篆点缀：留款落印 -->
  <circle cx="64" cy="85" r="2.2" fill="#fcfaf4" opacity="0.8"/>
</svg>
